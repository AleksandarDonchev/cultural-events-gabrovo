$kind: http-request
name: 'Delete Event'
method: DELETE
url: '{{baseUrl}}/api/events/{{eventId}}'
order: 4000
headers:
  - key: Authorization
    value: 'Bearer {{authToken}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status code is 200", function () { pm.response.to.have.status(200); });
      pm.test("Response is JSON", function () { pm.response.to.be.json; });
      pm.test("Has message property", function () { var json = pm.response.json(); pm.expect(json).to.have.property("message"); });
      pm.test("Message equals delete success", function () { var json = pm.response.json(); pm.expect(json.message).to.eql("Събитието е изтрито успешно"); });
