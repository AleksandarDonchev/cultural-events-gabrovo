$kind: http-request
name: 'Update Event'
method: PUT
url: '{{baseUrl}}/api/events/{{eventId}}'
order: 3000
headers:
  - key: Authorization
    value: 'Bearer {{authToken}}'
body:
  type: formdata
  content:
    - key: title
      type: text
      value: 'Фестивал на розата - Габрово 2026 (Обновено)'
    - key: description
      type: text
      value: 'Обновено описание на фестивала на розата в Габрово.'
    - key: date
      type: text
      value: '2026-09-20'
    - key: type
      type: text
      value: event
    - key: municipality
      type: text
      value: gabrovo
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status code is 200", function () { pm.response.to.have.status(200); });
      pm.test("Response is JSON", function () { pm.response.to.be.json; });
      pm.test("Has _id property", function () { var json = pm.response.json(); pm.expect(json).to.have.property("_id"); });
      pm.test("Title matches updated value", function () { var json = pm.response.json(); pm.expect(json.title).to.eql("Фестивал на розата - Габрово 2026 (Обновено)"); });
      pm.test("Date contains 2026-09-20", function () { var json = pm.response.json(); pm.expect(json.date).to.include("2026-09-20"); });
