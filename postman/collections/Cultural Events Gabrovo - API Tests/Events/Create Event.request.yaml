$kind: http-request
name: 'Create Event'
method: POST
url: '{{baseUrl}}/api/events'
order: 2000
headers:
  - key: Authorization
    value: 'Bearer {{authToken}}'
body:
  type: formdata
  content:
    - key: title
      type: text
      value: 'Фестивал на розата - Габрово 2026'
    - key: description
      type: text
      value: 'Ежегоден фестивал, посветен на розата и традиционните занаяти на Габрово.'
    - key: date
      type: text
      value: '2026-09-15'
    - key: type
      type: text
      value: event
    - key: municipality
      type: text
      value: gabrovo
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status code is 201", function () { pm.response.to.have.status(201); });
      pm.test("Response is JSON", function () { pm.response.to.be.json; });
      pm.test("Has _id property", function () { var json = pm.response.json(); pm.expect(json).to.have.property("_id"); });
      pm.test("Has title property", function () { var json = pm.response.json(); pm.expect(json).to.have.property("title"); });
      pm.test("Title matches", function () { var json = pm.response.json(); pm.expect(json.title).to.eql("Фестивал на розата - Габрово 2026"); });
      pm.test("Municipality equals gabrovo", function () { var json = pm.response.json(); pm.expect(json.municipality).to.eql("gabrovo"); });
      pm.test("Type equals event", function () { var json = pm.response.json(); pm.expect(json.type).to.eql("event"); });
      var json = pm.response.json(); if (json._id) { pm.collectionVariables.set("eventId", json._id); }
