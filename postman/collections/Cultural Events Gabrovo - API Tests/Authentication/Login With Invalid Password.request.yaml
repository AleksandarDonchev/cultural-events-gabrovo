$kind: http-request
name: 'Login With Invalid Password'
method: POST
url: '{{baseUrl}}/api/auth/login'
order: 3000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "email": "ivan.petrov@example.com",
      "password": "WrongPassword999"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status code is 400", function () { pm.response.to.have.status(400); });
      pm.test("Has message property", function () { var json = pm.response.json(); pm.expect(json).to.have.property("message"); });
      pm.test("Message equals invalid credentials", function () { var json = pm.response.json(); pm.expect(json.message).to.eql("Невалиден имейл или парола"); });
