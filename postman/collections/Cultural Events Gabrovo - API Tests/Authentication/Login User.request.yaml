$kind: http-request
name: 'Login User'
method: POST
url: '{{baseUrl}}/api/auth/login'
order: 2000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "email": "ivan.petrov@example.com",
      "password": "Test1234!"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status code is 200", function () { pm.response.to.have.status(200); });
      pm.test("Response is JSON", function () { pm.response.to.be.json; });
      pm.test("Has token property", function () { var json = pm.response.json(); pm.expect(json).to.have.property("token"); });
      pm.test("Token is a non-empty string", function () { var json = pm.response.json(); pm.expect(json.token).to.be.a("string").and.not.empty; });
      pm.test("Has user property", function () { var json = pm.response.json(); pm.expect(json).to.have.property("user"); });
      pm.test("User role exists", function () { var json = pm.response.json(); pm.expect(json.user).to.have.property("role"); });
      var json = pm.response.json(); if (json.token) { pm.collectionVariables.set("authToken", json.token); }
